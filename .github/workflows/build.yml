name: Build APK

on:
  push:
    branches: [main, master]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - uses: android-actions/setup-android@v3
        with:
          packages: "platform-tools platforms;android-34 build-tools;34.0.0"

      - name: Unzip app (web files to www, icon/splash to assets)
        run: |
          ZIP=$(ls *.zip | head -n1)
          rm -rf _src www assets && mkdir _src www
          unzip -q "$ZIP" -d _src
          HTML=$(find _src -name index.html -not -path "*/__MACOSX/*" | head -n1)
          [ -z "$HTML" ] && HTML=$(find _src -name "*.html" -not -path "*/__MACOSX/*" | head -n1)
          SRC=$(dirname "$HTML")
          rsync -a --exclude assets "$SRC"/ www/
          [ -f www/index.html ] || cp "$HTML" www/index.html
          [ -d "$SRC/assets" ] && cp -r "$SRC/assets" assets
          ls -R www assets

      - name: Create Capacitor Android project
        run: |
          npm init -y
          npm i @capacitor/core@6 @capacitor/cli@6 @capacitor/android@6 @capacitor/splash-screen@6
          npm i -D @capacitor/assets@3
          cat > capacitor.config.json <<'JSON'
          {
            "appId": "com.yahakeem.kalam",
            "appName": "Kalam",
            "webDir": "www",
            "backgroundColor": "#12302f",
            "plugins": {
              "SplashScreen": {
                "launchShowDuration": 500,
                "launchAutoHide": true,
                "launchFadeOutDuration": 300,
                "backgroundColor": "#12302f",
                "showSpinner": false,
                "androidScaleType": "CENTER_CROP"
              }
            }
          }
          JSON
          npx cap add android

      - name: Generate icon and splash screen
        run: |
          npx capacitor-assets generate --android \
            --iconBackgroundColor '#12302f' --iconBackgroundColorDark '#12302f' \
            --splashBackgroundColor '#12302f' --splashBackgroundColorDark '#12302f'
          npx cap sync android

      - name: Point Gradle at the SDK
        run: echo "sdk.dir=$ANDROID_HOME" > android/local.properties

      - name: Build debug APK
        working-directory: android
        run: |
          chmod +x gradlew
          ./gradlew assembleDebug --no-daemon

      - uses: actions/upload-artifact@v4
        with:
          name: Kalam-apk
          path: android/app/build/outputs/apk/debug/app-debug.apk
